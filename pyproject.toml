[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-photos"
dynamic = ["version"]
description = "An unofficial Amazon Photos client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Trevor Hobenshield"}]
keywords = ["amazon photos", "api", "search", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiofiles>=23.2",
    "httpx[http2]>=0.27,<1",
    "orjson>=3.9",
    "pandas>=2.2,<4",
    "pyarrow>=16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
extras = ["torch", "torchvision", "timm", "Pillow"]

[project.urls]
Repository = "https://github.com/panzerchris/amazon_photos"
Upstream = "https://github.com/trevorhobenshield/amazon_photos"

[tool.setuptools.packages.find]
include = ["amazon_photos*"]

[tool.setuptools.dynamic]
version = {attr = "amazon_photos.__version__.__version__"}

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
